# Before first run: copy .env.example to .env and fill in your real credentials.
# Docker Compose reads .env automatically for ${VAR} substitution below.
# Dashboard: http://localhost:8000   |   MT5 VNC: http://localhost:3000

services:
  mt5:
    image: gmag11/metatrader5_vnc:latest
    container_name: mt5
    restart: unless-stopped
    ports:
      - "3000:3000"       # noVNC browser UI → http://localhost:3000
      - "8000:8080"       # Trading dashboard → http://localhost:8000
    env_file:
      - .env              # hard-fail if .env is missing (prevents silent empty-credential start)
    environment:
      - CUSTOM_USER=${VNC_USER}
      - PASSWORD=${VNC_PASSWORD}
      # Bot credentials — read by config.py via os.environ
      - TRADING_ID=${TRADING_ID}
      - MT5_PASSWORD=${MT5_PASSWORD}
      - MT5_SERVER=${MT5_SERVER}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - NEWS_API_URL=${NEWS_API_URL}
      # Dashboard JWT auth
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
      - JWT_ACCESS_EXPIRES_MINUTES=${JWT_ACCESS_EXPIRES_MINUTES:-15}
      - JWT_REFRESH_EXPIRES_DAYS=${JWT_REFRESH_EXPIRES_DAYS:-7}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets Wine reach host-bound ports (e.g. forex-api:8087)
    volumes:
      - mt5_config:/config
      - ./fix_rpyc.sh:/custom-cont-init.d/fix_rpyc.sh   # no-op, kept to avoid init error
      - ./override_start.sh:/Metatrader/start.sh
      - .:/bot                                            # code + persistent data on host
      - news_cache:/bot/.cache                            # news API cache — in-container, wiped Friday
      - zones_data:/bot/zones                             # zone snapshots — in-container, wiped Friday

volumes:
  mt5_config:
  news_cache:   # news API TTL cache — wiped every Friday at market close
  zones_data:   # zone snapshots — wiped every Friday at market close, remapped Monday open