services:

  mt5:
    image: gmag11/metatrader5_vnc:latest
    container_name: mt5
    restart: unless-stopped
    ports:
      - "3000:3000"       # noVNC  → http://localhost:3000
      - "18812:18812"     # RPyC bridge
    environment:
      - CUSTOM_USER=${VNC_USER}
      - PASSWORD=${VNC_PASSWORD}
    volumes:
      - mt5_config:/config
      - ./fix_rpyc.sh:/custom-cont-init.d/fix_rpyc.sh
      - ./override_start.sh:/Metatrader/start.sh   # ← add this
    healthcheck:
      test: ["CMD", "bash", "-c", "ss -tlnp | grep -q 18812"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s   # give Wine time to boot

  zone_bot:
    build: .
    container_name: zone_bot
    restart: unless-stopped
    depends_on:
      mt5:
        condition: service_healthy
    environment:
      - MT5_HOST=mt5
      - MT5_PORT=18812
      - TRADING_ID=${TRADING_ID}
      - MT5_PASSWORD=${MT5_PASSWORD}
      - MT5_SERVER=${MT5_SERVER}
      - NEWS_API_KEY=${NEWS_API_KEY}
    volumes:
      - ./logs:/app/logs

volumes:
  mt5_config: