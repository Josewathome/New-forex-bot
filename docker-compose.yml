# Before first run: copy .env.example to .env and fill in your real credentials.
# Docker Compose reads .env automatically for ${VAR} substitution below.
# Dashboard: http://localhost:8000   |   MT5 VNC: http://localhost:3000

services:
  mt5:
    image: gmag11/metatrader5_vnc:latest
    container_name: mt5
    restart: unless-stopped
    ports:
      - "3000:3000"       # noVNC browser UI → http://localhost:3000
      - "8000:8080"       # Trading dashboard → http://localhost:8000
    env_file:
      - .env              # hard-fail if .env is missing (prevents silent empty-credential start)
    environment:
      - CUSTOM_USER=${VNC_USER}
      - PASSWORD=${VNC_PASSWORD}
      # Bot credentials — read by config.py via os.environ
      - TRADING_ID=${TRADING_ID}
      - MT5_PASSWORD=${MT5_PASSWORD}
      - MT5_SERVER=${MT5_SERVER}
      - NEWS_API_KEY=${NEWS_API_KEY}
    volumes:
      - mt5_config:/config
      - ./fix_rpyc.sh:/custom-cont-init.d/fix_rpyc.sh   # no-op, kept to avoid init error
      - ./override_start.sh:/Metatrader/start.sh
      - .:/bot                                            # entire project mounted at /bot

volumes:
  mt5_config: